privilegeTargets:

  'Neos\Flow\Security\Authorization\Privilege\Method\MethodPrivilege':
    'Sandstorm.NeosAcl:Backend.DynamicRoles':
      label: Manage dynamic roles in the backend module
      matcher: 'method(Sandstorm\NeosAcl\Controller\Module\DynamicRoleController->(index|new|create|edit|update|remove)Action())'
    'Sandstorm.NeosAcl:Backend.NodeTree':
      label: Load document children for the node picker of the dynamic role form
      matcher: 'method(Sandstorm\NeosAcl\Controller\NodeTreeController->childrenAction())'

  'Neos\Neos\Security\Authorization\Privilege\ModulePrivilege':
    'Sandstorm.NeosAcl:Backend.Module.Administration.DynamicRoles':
      label: General access to the dynamic roles module
      matcher: 'administration/dynamicRoles'

  # Every site root carries the subtree tag "neosacl-restricted" (see ./flow neosacl:setup),
  # so editing anywhere needs this grant or a dynamic role. Dynamic roles are added at
  # runtime by Sandstorm\NeosAcl\Policy\DynamicPolicyGenerator.
  'Neos\Neos\Security\Authorization\Privilege\EditNodePrivilege':
    'Sandstorm.NeosAcl:EditAllNodes':
      label: Edit all nodes regardless of dynamic roles
      matcher: 'neosacl-restricted'

roles:

  'Neos.Neos:Administrator':
    privileges:
      -
        privilegeTarget: 'Sandstorm.NeosAcl:Backend.DynamicRoles'
        permission: GRANT
      -
        privilegeTarget: 'Sandstorm.NeosAcl:Backend.NodeTree'
        permission: GRANT
      -
        privilegeTarget: 'Sandstorm.NeosAcl:Backend.Module.Administration.DynamicRoles'
        permission: GRANT
      -
        privilegeTarget: 'Sandstorm.NeosAcl:EditAllNodes'
        permission: GRANT

  'Neos.Neos:Editor':
    privileges:
      -
        privilegeTarget: 'Sandstorm.NeosAcl:EditAllNodes'
        permission: GRANT
